
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guillaume Raynal — Concept Art / Illustration</title>

<style>
:root {
    --background: #f5f3ee;
    --text: #292824;
    --muted: #77746e;
    --border: #dedbd3;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
}

header {
    padding: 58px 6vw 42px;
}

.header-content {
    max-width: 1500px;
    margin: 0 auto;
}

h1 {
    margin: 0;
    font-size: clamp(25px, 3vw, 36px);
    font-weight: 400;
    letter-spacing: -1.2px;
}

.subtitle {
    margin-top: 9px;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.2px;
}

.email {
    display: inline-block;
    margin-top: 19px;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    transition: opacity 0.2s ease;
}

.email:hover {
    opacity: 0.55;
}

.statement {
    margin-top: 22px;
    font-size: 11px;
    line-height: 1.6;
    letter-spacing: 0.15px;
    color: var(--muted);
}

main {
    max-width: 1500px;
    margin: 0 auto;
    padding: 0 6vw;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 0 0 25px;
    border-bottom: 1px solid var(--border);
}

.filter-button {
    padding: 0;
    border: none;
    background: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.2s ease;
}

.filter-button:hover,
.filter-button.active {
    color: var(--text);
}

.filter-button.active {
    text-decoration: underline;
    text-underline-offset: 5px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 34px 24px;
    padding-top: 30px;
    padding-bottom: 90px;
}

.gallery-item {
    min-width: 0;
    cursor: pointer;
    animation: fadeIn 0.45s ease both;
}

.gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: opacity 0.25s ease;
}

.gallery-item:hover img {
    opacity: 0.88;
}

.gallery-item.hidden {
    display: none;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

footer {
    max-width: 1500px;
    margin: 0 auto;
    padding: 25px 6vw 35px;
    color: var(--muted);
    font-size: 11px;
}

/* Lightbox */

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 55px;
    background: rgba(20, 20, 19, 0.96);
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
}

.lightbox-close,
.lightbox-prev,
.lightbox-next {
    position: absolute;
    border: none;
    background: none;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;
    font-weight: 300;
    cursor: pointer;
    opacity: 0.75;
    transition: opacity 0.2s ease;
}

.lightbox-close:hover,
.lightbox-prev:hover,
.lightbox-next:hover {
    opacity: 1;
}

.lightbox-close {
    top: 20px;
    right: 27px;
    font-size: 32px;
}

.lightbox-prev {
    left: 25px;
    top: 50%;
    transform: translateY(-50%);
}

.lightbox-next {
    right: 25px;
    top: 50%;
    transform: translateY(-50%);
}

.lightbox-counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.65);
    font-size: 11px;
    letter-spacing: 1px;
}

@media (max-width: 700px) {
    header {
        padding: 38px 6vw 32px;
    }

    main {
        padding: 0 5vw;
    }

    .gallery {
        grid-template-columns: 1fr;
        gap: 22px;
        padding-top: 22px;
        padding-bottom: 60px;
    }

    .filters {
        gap: 19px;
    }

    .lightbox {
        padding: 45px 15px;
    }

    .lightbox-prev {
        left: 8px;
    }

    .lightbox-next {
        right: 8px;
    }

    footer {
        padding: 20px 5vw 28px;
    }
}

button:focus-visible,
a:focus-visible,
.gallery-item:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 5px;
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>Guillaume Raynal</h1>

        <div class="subtitle">
            Concept Art / Illustration
        </div>

        <a class="email" href="mailto:guillaumeraynal.contact@gmail.com">
            guillaumeraynal.contact@gmail.com
        </a>

        <div class="statement">
            All work shown here has been done without generative AI.
        </div>
    </div>
</header>

<main>

    <nav class="filters" aria-label="Gallery categories">
        <button class="filter-button active"
                data-filter="all"
                aria-pressed="true">
            All
        </button>

        <button class="filter-button"
                data-filter="illustration"
                aria-pressed="false">
            Illustration
        </button>

        <button class="filter-button"
                data-filter="studies"
                aria-pressed="false">
            Studies
        </button>

        <button class="filter-button"
                data-filter="gestures"
                aria-pressed="false">
            Gestures
        </button>
    </nav>

    <section class="gallery" id="gallery" aria-label="Artwork gallery">
    </section>

</main>

<footer>
    © 2026 Guillaume Raynal
</footer>

<div class="lightbox" id="lightbox" role="dialog"
     aria-modal="true" aria-label="Artwork viewer">

    <button class="lightbox-close"
            id="lightboxClose"
            aria-label="Close image viewer">
        ×
    </button>

    <button class="lightbox-prev"
            id="lightboxPrev"
            aria-label="Previous image">
        ‹
    </button>

    <img id="lightboxImage" src="" alt="Artwork">

    <button class="lightbox-next"
            id="lightboxNext"
            aria-label="Next image">
        ›
    </button>

    <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<script>
const categories = {
    illustration: {
        first: 7,
        last: 1
    },

    studies: {
        first: 27,
        last: 1
    },

    gestures: {
        first: 48,
        last: 6
    }
};

const gallery = document.getElementById("gallery");
const filterButtons = document.querySelectorAll(".filter-button");

let currentImages = [];
let currentIndex = 0;
let previouslyFocused = null;

function getImages() {
    const images = [];

    for (const category in categories) {
        const range = categories[category];

        for (let i = range.first; i >= range.last; i--) {
            images.push({
                src: `${category}/${i}.webp`,
                category: category
            });
        }
    }

    return images;
}

const images = getImages();

function renderGallery(filter = "all") {
    gallery.innerHTML = "";

    currentImages = images.filter(image =>
        filter === "all" || image.category === filter
    );

    currentImages.forEach((image, index) => {
        const item = document.createElement("div");
        item.className = "gallery-item";
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", `Open ${image.category} image ${index + 1}`);

        const img = document.createElement("img");
        img.src = image.src;
        img.alt = `${image.category} artwork`;
        img.loading = "lazy";

        img.addEventListener("error", () => {
            item.remove();
            console.warn("Image could not be loaded:", image.src);
        });

        item.appendChild(img);

        item.addEventListener("click", () => {
            openLightbox(index);
        });

        item.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openLightbox(index);
            }
        });

        gallery.appendChild(item);
    });
}

filterButtons.forEach(button => {
    button.addEventListener("click", () => {
        filterButtons.forEach(btn => {
            btn.classList.remove("active");
            btn.setAttribute("aria-pressed", "false");
        });

        button.classList.add("active");
        button.setAttribute("aria-pressed", "true");

        renderGallery(button.dataset.filter);
    });
});

/* Lightbox */

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxCounter = document.getElementById("lightboxCounter");

function openLightbox(index) {
    currentIndex = index;
    previouslyFocused = document.activeElement;

    updateLightbox();

    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";

    document.getElementById("lightboxClose").focus();
}

function updateLightbox() {
    const image = currentImages[currentIndex];

    if (!image) return;

    lightboxImage.src = image.src;
    lightboxImage.alt = `${image.category} artwork`;

    lightboxCounter.textContent =
        `${currentIndex + 1} / ${currentImages.length}`;
}

function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImage.src = "";
    document.body.style.overflow = "";

    if (previouslyFocused) {
        previouslyFocused.focus();
    }
}

function showNext() {
    currentIndex = (currentIndex + 1) % currentImages.length;
    updateLightbox();
}

function showPrevious() {
    currentIndex =
        (currentIndex - 1 + currentImages.length) % currentImages.length;

    updateLightbox();
}

document.getElementById("lightboxClose")
    .addEventListener("click", closeLightbox);

document.getElementById("lightboxNext")
    .addEventListener("click", showNext);

document.getElementById("lightboxPrev")
    .addEventListener("click", showPrevious);

lightbox.addEventListener("click", event => {
    if (event.target === lightbox) {
        closeLightbox();
    }
});

document.addEventListener("keydown", event => {
    if (!lightbox.classList.contains("open")) return;

    if (event.key === "Escape") {
        closeLightbox();
    }

    if (event.key === "ArrowRight") {
        showNext();
    }

    if (event.key === "ArrowLeft") {
        showPrevious();
    }
});

/* Touch navigation */

let touchStartX = 0;
let touchStartY = 0;

lightbox.addEventListener("touchstart", event => {
    touchStartX = event.changedTouches[0].screenX;
    touchStartY = event.changedTouches[0].screenY;
}, { passive: true });

lightbox.addEventListener("touchend", event => {
    const touchEndX = event.changedTouches[0].screenX;
    const touchEndY = event.changedTouches[0].screenY;

    const differenceX = touchEndX - touchStartX;
    const differenceY = touchEndY - touchStartY;

    if (Math.abs(differenceX) > 50 &&
        Math.abs(differenceX) > Math.abs(differenceY)) {

        if (differenceX < 0) {
            showNext();
        } else {
            showPrevious();
        }
    }
}, { passive: true });

/* Initial gallery */

renderGallery();

</script>

</body>
</html>
