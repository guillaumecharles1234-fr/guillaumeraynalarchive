
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#f5f3ee">
<meta name="description" content="Guillaume Raynal — Illustration portfolio.">

<title>Guillaume Raynal — Illustration</title>

<style>
:root {
    --bg: #f5f3ee;
    --fg: #292824;
    --muted: #89867e;
    --line: #dedbd3;
    --lightbox: #1d1d1b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    scrollbar-gutter: stable;
}

body {
    background: var(--bg);
    color: var(--fg);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 42px 5.5% 30px;
}

/* HEADER */

header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 25px;
    margin-bottom: 54px;
}

.identity h1 {
    font-size: 21px;
    line-height: 1.2;
    font-weight: 500;
    letter-spacing: -0.7px;
}

.subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 7px;
}

.email {
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    margin-top: 4px;
    transition: color .2s ease;
}

.email:hover {
    color: var(--fg);
}

/* NAVIGATION */

nav {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-bottom: 30px;
}

nav button {
    position: relative;
    appearance: none;
    background: none;
    border: none;
    padding: 0 0 7px;
    font-family: inherit;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: color .2s ease;
}

nav button:hover,
nav button.active {
    color: var(--fg);
}

nav button.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background: var(--fg);
}

/* GALLERY */

.gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    column-gap: 24px;
    row-gap: 48px;
    align-items: start;
}

.artwork {
    min-width: 0;
    cursor: zoom-in;
    overflow: hidden;
}

.artwork img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: opacity .3s ease;
}

.artwork:hover img {
    opacity: .88;
}

.artwork:focus-visible {
    outline: 1px solid var(--fg);
    outline-offset: 5px;
}

.artwork img:not([src]) {
    visibility: hidden;
}

/* FOOTER */

footer {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 95px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
}

/* LIGHTBOX */

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--lightbox);
    align-items: center;
    justify-content: center;
    padding: 65px;
    touch-action: pan-y;
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    display: block;
    max-width: 90vw;
    max-height: 85vh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

.lightbox button {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    appearance: none;
    background: none;
    border: none;
    color: rgba(255,255,255,.7);
    font-family: Arial, sans-serif;
    font-size: 30px;
    font-weight: 300;
    cursor: pointer;
    width: 54px;
    height: 54px;
    transition: color .2s ease;
}

.lightbox button:hover {
    color: white;
}

.lightbox button:focus-visible {
    outline: 1px solid white;
    outline-offset: -5px;
}

.close {
    top: 14px;
    right: 20px;
}

.prev {
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
}

.next {
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
}

.image-counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.55);
    font-size: 11px;
    letter-spacing: .5px;
}

/* TABLET */

@media (max-width: 950px) {
    body {
        padding-left: 4%;
        padding-right: 4%;
    }

    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 20px;
        row-gap: 35px;
    }
}

/* MOBILE */

@media (max-width: 600px) {
    body {
        padding: 25px 17px 22px;
    }

    header {
        margin-bottom: 39px;
        flex-direction: column;
        gap: 14px;
    }

    .identity h1 {
        font-size: 20px;
    }

    .email {
        font-size: 11px;
    }

    nav {
        gap: 23px;
        margin-bottom: 24px;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }

    nav::-webkit-scrollbar {
        display: none;
    }

    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 12px;
        row-gap: 22px;
    }

    .artwork:hover img {
        opacity: 1;
    }

    footer {
        margin-top: 65px;
    }

    .lightbox {
        padding: 55px 12px;
    }

    .lightbox img {
        max-width: 96vw;
        max-height: 78vh;
    }

    .close {
        top: 5px;
        right: 8px;
    }

    .prev {
        left: 0;
    }

    .next {
        right: 0;
    }

    .lightbox button {
        width: 44px;
        height: 54px;
        font-size: 27px;
    }

    .image-counter {
        bottom: 15px;
    }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<header>
    <div class="identity">
        <h1>Guillaume Raynal</h1>
        <p class="subtitle">Illustration</p>
    </div>

    <a class="email"
       href="mailto:guillaumeraynal.contact@gmail.com">
       guillaumeraynal.contact@gmail.com
    </a>
</header>

<nav id="filters" aria-label="Portfolio categories">
    <button class="active"
            data-category="all"
            aria-pressed="true">All</button>

    <button data-category="illustration"
            aria-pressed="false">Illustration</button>

    <button data-category="studies"
            aria-pressed="false">Studies</button>

    <button data-category="gestures"
            aria-pressed="false">Gestures</button>
</nav>

<main class="gallery" id="gallery"></main>

<footer>
    <p>All work shown here has been done without generative AI.</p>
    <p>© 2026 Guillaume Raynal</p>
</footer>

<div class="lightbox"
     id="lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="Artwork viewer">

    <button class="close"
            id="close"
            aria-label="Close image">×</button>

    <button class="prev"
            id="prev"
            aria-label="Previous image">‹</button>

    <img id="lightboxImage" src="" alt="">

    <button class="next"
            id="next"
            aria-label="Next image">›</button>

    <span class="image-counter" id="counter"></span>
</div>

<script>

// IMAGE COLLECTIONS
// Change these numbers when adding or removing artwork.

const categories = {
    illustration: {
        first: 7,
        last: 1
    },

    studies: {
        first: 27,
        last: 1
    },

    gestures: {
        first: 48,
        last: 6
    }
};

const gallery = document.getElementById("gallery");
const filters = document.querySelectorAll("#filters button");

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const counter = document.getElementById("counter");

let currentImages = [];
let currentIndex = 0;
let previousFocus = null;

const closeButton = document.getElementById("close");

// GENERATE IMAGE PATHS

function getImages(category) {
    const data = categories[category];
    const images = [];

    for (let i = data.first; i >= data.last; i--) {
        images.push({
            category,
            src: `${category}/${i}.webp`
        });
    }

    return images;
}

// RENDER GALLERY

function renderGallery(category = "all") {
    gallery.innerHTML = "";

    let images = [];

    if (category === "all") {
        Object.keys(categories).forEach(key => {
            images = images.concat(getImages(key));
        });
    } else {
        images = getImages(category);
    }

    const uniqueImages = [
        ...new Map(images.map(image => [image.src, image])).values()
    ];

    uniqueImages.forEach((item, index) => {

        const container = document.createElement("div");
        container.className = "artwork";

        container.tabIndex = 0;
        container.setAttribute("role", "button");
        container.setAttribute("aria-label",
            `View ${item.category} artwork ${item.src.split("/").pop()}`
        );

        const img = document.createElement("img");

        img.src = item.src;
        img.alt = `${item.category} illustration`;
        img.loading = index < 4 ? "eager" : "lazy";
        img.decoding = "async";

        container.appendChild(img);
        gallery.appendChild(container);

        function openItem() {
            currentImages = uniqueImages;
            currentIndex = index;
            openLightbox();
        }

        container.addEventListener("click", openItem);

        container.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openItem();
            }
        });

        img.addEventListener("error", () => {
            container.remove();
        });
    });
}

// CATEGORY FILTERS

filters.forEach(button => {
    button.addEventListener("click", () => {

        filters.forEach(item => {
            item.classList.remove("active");
            item.setAttribute("aria-pressed", "false");
        });

        button.classList.add("active");
        button.setAttribute("aria-pressed", "true");

        renderGallery(button.dataset.category);
    });
});

// LIGHTBOX

function openLightbox() {
    previousFocus = document.activeElement;

    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";

    updateLightbox();

    closeButton.focus();
}

function closeLightbox() {
    if (!lightbox.classList.contains("open")) return;

    lightbox.classList.remove("open");
    lightboxImage.src = "";
    document.body.style.overflow = "";

    if (previousFocus) {
        previousFocus.focus();
    }
}

function updateLightbox() {
    const item = currentImages[currentIndex];

    if (!item) return;

    lightboxImage.src = item.src;
    lightboxImage.alt = `${item.category} illustration`;

    counter.textContent =
        `${currentIndex + 1} / ${currentImages.length}`;
}

function showNext() {
    if (!currentImages.length) return;

    currentIndex =
        (currentIndex + 1) % currentImages.length;

    updateLightbox();
}

function showPrevious() {
    if (!currentImages.length) return;

    currentIndex =
        (currentIndex - 1 + currentImages.length)
        % currentImages.length;

    updateLightbox();
}

// BUTTONS

closeButton.addEventListener("click", closeLightbox);

document.getElementById("next")
    .addEventListener("click", showNext);

document.getElementById("prev")
    .addEventListener("click", showPrevious);

// CLICK OUTSIDE IMAGE

lightbox.addEventListener("click", event => {
    if (event.target === lightbox) {
        closeLightbox();
    }
});

// KEYBOARD NAVIGATION

document.addEventListener("keydown", event => {

    if (!lightbox.classList.contains("open")) return;

    if (event.key === "Escape") {
        closeLightbox();
    }

    if (event.key === "ArrowRight") {
        showNext();
    }

    if (event.key === "ArrowLeft") {
        showPrevious();
    }

    // Keep keyboard focus inside the viewer.
    if (event.key === "Tab") {
        const controls = [
            closeButton,
            document.getElementById("prev"),
            document.getElementById("next")
        ];

        const first = controls[0];
        const last = controls[controls.length - 1];

        if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
        } else if (!event.shiftKey &&
                   document.activeElement === last) {
            event.preventDefault();
            first.focus();
        }
    }
});

// MOBILE TOUCH NAVIGATION

let touchStartX = 0;
let touchStartY = 0;

lightbox.addEventListener("touchstart", event => {

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;

}, { passive: true });

lightbox.addEventListener("touchend", event => {

    const touchEndX = event.changedTouches[0].clientX;
    const touchEndY = event.changedTouches[0].clientY;

    const deltaX = touchEndX - touchStartX;
    const deltaY = touchEndY - touchStartY;

    if (Math.abs(deltaX) > 65 &&
        Math.abs(deltaX) > Math.abs(deltaY)) {

        if (deltaX < 0) {
            showNext();
        } else {
            showPrevious();
        }

    } else if (deltaY > 110 &&
               Math.abs(deltaY) > Math.abs(deltaX)) {

        closeLightbox();
    }

}, { passive: true });

// INITIAL GALLERY

renderGallery();

</script>

</body>
</html>
