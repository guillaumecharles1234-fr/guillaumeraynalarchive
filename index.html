<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guillaume Raynal — Concept Art / Illustration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 80px;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            margin: 0 0 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #555555;
            margin-bottom: 8px;
        }

        .note {
            font-size: 12px;
            color: #888888;
        }

        main {
            max-width: 1200px;
            margin: auto;
        }

        section {
            margin-bottom: 100px;
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
        }

        footer {
            max-width: 1200px;
            margin: 100px auto 30px;
            font-size: 14px;
            color: #777777;
        }

        footer a {
            color: #111111;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .copyright {
            margin-top: 12px;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px;
            }

            header {
                margin-bottom: 50px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            section {
                margin-bottom: 70px;
            }
        }
    </style>
</head>
