<style>

    /* =========================
       BASIC
    ========================= */

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 40px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background: #ffffff;
        color: #111111;

        opacity: 0;

        animation:
            pageFadeIn
            0.7s
            ease
            forwards;
    }

    @keyframes pageFadeIn {

        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }

    }


    /* =========================
       HEADER
    ========================= */

    header {
        max-width: 1200px;

        margin:
            0
            auto
            80px;
    }

    h1 {
        font-size: 32px;
        font-weight: 500;

        margin:
            0
            0
            8px;
    }

    .subtitle {
        font-size: 16px;
        color: #555555;

        margin-bottom: 10px;
    }

    .contact {
        font-size: 13px;
        color: #777777;
    }

    .contact a {
        color: #555555;
        text-decoration: none;

        transition:
            color 0.2s ease;
    }

    .contact a:hover {
        color: #111111;
    }


    /* =========================
       MAIN
    ========================= */

    main {
        max-width: 1200px;
        margin: auto;
    }

    section {
        margin-bottom: 100px;
    }

    h2 {
        font-size: 18px;
        font-weight: 500;

        margin:
            0
            0
            30px;
    }


    /* =========================
       GALLERY
    ========================= */

    .gallery {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 20px;
    }

    .gallery img {
        width: 100%;
        height: auto;

        display: block;

        cursor: pointer;

        -webkit-tap-highlight-color:
            transparent;

        user-select: none;
        -webkit-user-select: none;

        -webkit-user-drag: none;

        transition:
            opacity 0.18s ease;
    }

    .gallery img:hover {
        opacity: 0.88;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        max-width: 1200px;

        margin:
            100px
            auto
            30px;

        font-size: 14px;
        color: #777777;
    }

    footer a {
        color: #111111;
        text-decoration: none;
    }

    footer a:hover {
        text-decoration: underline;
    }

    .ai-note {
        margin-top: 18px;

        font-size: 11px;
        line-height: 1.5;

        color: #999999;
    }

    .copyright {
        margin-top: 12px;
    }


    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {
        position: fixed;

        z-index: 1000;

        inset: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        padding: 20px;

        background:
            rgba(0, 0, 0, 0.97);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
            opacity 0.25s ease,
            visibility 0.25s ease;

        overflow: hidden;

        touch-action: none;
    }

    .lightbox.active {
        opacity: 1;

        visibility: visible;

        pointer-events: auto;
    }


    /* =========================
       LIGHTBOX IMAGE
    ========================= */

    .lightbox img {
        display: block;

        max-width:
            calc(100vw - 40px);

        max-height:
            calc(100vh - 40px);

        width: auto;
        height: auto;

        object-fit: contain;

        user-select: none;
        -webkit-user-select: none;

        -webkit-touch-callout: none;
        -webkit-user-drag: none;

        transform:
            scale(0.94);

        transition:
            transform
            0.28s
            cubic-bezier(
                0.2,
                0.8,
                0.2,
                1
            );
    }

    .lightbox.active img {
        transform:
            scale(1);
    }


    /* =========================
       CLOSE BUTTON
    ========================= */

    .lightbox-close {
        position: absolute;

        top: 15px;
        right: 20px;

        width: 50px;
        height: 50px;

        display: flex;

        align-items: center;
        justify-content: center;

        color: white;

        font-size: 36px;
        font-weight: 300;

        line-height: 1;

        cursor: pointer;

        user-select: none;

        z-index: 10;

        -webkit-tap-highlight-color:
            transparent;

        border-radius: 50%;

        transition:
            background 0.18s ease,
            transform 0.18s ease;
    }

    .lightbox-close:hover {
        background:
            rgba(255, 255, 255, 0.10);

        transform:
            scale(1.05);
    }


    /* =========================
       LIGHTBOX COUNTER
    ========================= */

    .lightbox-counter {
        position: absolute;

        left: 50%;
        bottom: 20px;

        transform:
            translateX(-50%);

        color:
            rgba(255, 255, 255, 0.65);

        font-size: 12px;

        letter-spacing: 0.04em;

        pointer-events: none;

        z-index: 10;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        body {
            padding: 20px;
        }

        header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 28px;
        }

        .subtitle {
            font-size: 15px;
        }

        .contact {
            font-size: 12px;
        }


        /* =========================
           MOBILE GALLERY
        ========================= */

        .gallery {
            grid-template-columns: 1fr;

            gap: 30px;
        }

        .gallery img {
            transition:
                opacity 0.12s ease,
                transform 0.12s ease;
        }

        .gallery img:active {
            opacity: 0.78;

            transform:
                scale(0.995);
        }


        section {
            margin-bottom: 70px;
        }


        /* =========================
           MOBILE FOOTER
        ========================= */

        footer {
            margin-top: 70px;
            margin-bottom: 20px;
        }


        /* =========================
           MOBILE LIGHTBOX
        ========================= */

        .lightbox {

            width: 100vw;
            height: 100dvh;

            min-height: 100dvh;

            inset: 0;

            padding:
                env(safe-area-inset-top)
                0
                env(safe-area-inset-bottom)
                0;

            background:
                rgba(0, 0, 0, 0.98);
        }


        .lightbox img {

            max-width: 100vw;

            max-height:
                calc(
                    100dvh
                    -
                    env(safe-area-inset-top)
                    -
                    env(safe-area-inset-bottom)
                    -
                    20px
                );

            width: auto;
            height: auto;

            transform:
                scale(0.92);

            transition:
                transform
                0.32s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                );
        }

        .lightbox.active img {
            transform:
                scale(1);
        }


        /* =========================
           MOBILE CLOSE
        ========================= */

        .lightbox-close {

            top:
                calc(
                    8px
                    +
                    env(safe-area-inset-top)
                );

            right: 8px;

            width: 54px;
            height: 54px;

            font-size: 34px;
        }


        /* =========================
           MOBILE COUNTER
        ========================= */

        .lightbox-counter {

            bottom:
                calc(
                    10px
                    +
                    env(safe-area-inset-bottom)
                );

            font-size: 11px;
        }

    }


    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

        html {
            scroll-behavior: auto;
        }

        body {
            animation: none;
            opacity: 1;
        }

        .lightbox,
        .lightbox img,
        .gallery img,
        .lightbox-close {
            transition: none;
        }

    }

</style>

<script>

    /* =========================
       ELEMENTS
    ========================= */

    const galleryImages =
        Array.from(
            document.querySelectorAll(
                '.gallery img'
            )
        );

    const lightbox =
        document.getElementById(
            'lightbox'
        );

    const lightboxImage =
        document.getElementById(
            'lightboxImage'
        );

    const lightboxClose =
        document.getElementById(
            'lightboxClose'
        );

    const lightboxCounter =
        document.getElementById(
            'lightboxCounter'
        );


    let currentIndex = 0;

    let previousBodyOverflow = '';


    /* =========================
       PRELOAD IMAGE
    ========================= */

    function preloadImage(index) {

        if (
            index < 0 ||
            index >= galleryImages.length
        ) {
            return;
        }

        const image =
            new Image();

        image.src =
            galleryImages[index].src;
    }


    /* =========================
       UPDATE LIGHTBOX
    ========================= */

    function updateLightbox(index) {

        currentIndex = index;

        const image =
            galleryImages[currentIndex];

        lightboxImage.src =
            image.src;

        lightboxImage.alt =
            image.alt;

        lightboxCounter.textContent =
            `${currentIndex + 1} / ${galleryImages.length}`;


        /* Prepare adjacent images */

        preloadImage(
            currentIndex - 1
        );

        preloadImage(
            currentIndex + 1
        );

    }


    /* =========================
       OPEN LIGHTBOX
    ========================= */

    function openLightbox(index) {

        updateLightbox(index);

        previousBodyOverflow =
            document.body.style.overflow;

        lightbox.classList.add(
            'active'
        );

        lightbox.setAttribute(
            'aria-hidden',
            'false'
        );

        document.body.style.overflow =
            'hidden';

    }


    /* =========================
       CLOSE LIGHTBOX
    ========================= */

    function closeLightbox() {

        lightbox.classList.remove(
            'active'
        );

        lightbox.setAttribute(
            'aria-hidden',
            'true'
        );

        document.body.style.overflow =
            previousBodyOverflow;

        setTimeout(function() {

            if (
                !lightbox.classList.contains(
                    'active'
                )
            ) {

                lightboxImage.src = '';

            }

        }, 300);

    }


    /* =========================
       NEXT / PREVIOUS
    ========================= */

    function showNext() {

        if (
            currentIndex <
            galleryImages.length - 1
        ) {

            updateLightbox(
                currentIndex + 1
            );

        }

    }


    function showPrevious() {

        if (currentIndex > 0) {

            updateLightbox(
                currentIndex - 1
            );

        }

    }


    /* =========================
       IMAGE CLICK
    ========================= */

    galleryImages.forEach(
        function(image, index) {

            image.addEventListener(
                'click',
                function() {

                    openLightbox(index);

                }
            );

        }
    );


    /* =========================
       BACKGROUND CLICK
    ========================= */

    lightbox.addEventListener(
        'click',
        function(event) {

            if (
                event.target ===
                lightbox
            ) {

                closeLightbox();

            }

        }
    );


    /* =========================
       CLOSE BUTTON
    ========================= */

    lightboxClose.addEventListener(
        'click',
        function(event) {

            event.stopPropagation();

            closeLightbox();

        }
    );


    /* =========================
       KEYBOARD
    ========================= */

    document.addEventListener(
        'keydown',
        function(event) {

            if (
                !lightbox.classList.contains(
                    'active'
                )
            ) {
                return;
            }


            if (
                event.key === 'Escape'
            ) {

                closeLightbox();

            }


            if (
                event.key === 'ArrowRight'
            ) {

                showNext();

            }


            if (
                event.key === 'ArrowLeft'
            ) {

                showPrevious();

            }

        }
    );


    /* =========================
       MOBILE SWIPE
       ========================= */

    let startX = 0;
    let startY = 0;

    let currentX = 0;
    let currentY = 0;

    let dragging = false;


    lightbox.addEventListener(
        'touchstart',
        function(event) {

            if (
                window.innerWidth > 700
            ) {
                return;
            }

            if (
                !lightbox.classList.contains(
                    'active'
                )
            ) {
                return;
            }

            startX =
                event.touches[0].clientX;

            startY =
                event.touches[0].clientY;

            currentX = startX;
            currentY = startY;

            dragging = true;

            lightboxImage.style.transition =
                'none';

            lightbox.style.transition =
                'none';

        },
        {
            passive: true
        }
    );


    lightbox.addEventListener(
        'touchmove',
        function(event) {

            if (!dragging) {
                return;
            }

            currentX =
                event.touches[0].clientX;

            currentY =
                event.touches[0].clientY;


            const deltaX =
                currentX - startX;

            const deltaY =
                currentY - startY;


            /*
               Horizontal swipe:
               move image with finger.
            */

            if (
                Math.abs(deltaX) >
                Math.abs(deltaY)
            ) {

                const movement =
                    deltaX;

                lightboxImage.style.transform =
                    `translateX(${movement}px) scale(0.96)`;

                return;
            }


            /*
               Vertical swipe:
               only downward movement
               closes the image.
            */

            if (deltaY > 0) {

                const movement =
                    Math.min(
                        deltaY,
                        350
                    );

                const scale =
                    Math.max(
                        0.78,
                        1 -
                        movement / 1400
                    );

                lightboxImage.style.transform =
                    `translateY(${movement}px) scale(${scale})`;


                const opacity =
                    Math.max(
                        0.35,
                        0.98 -
                        movement / 450
                    );

                lightbox.style.background =
                    `rgba(0, 0, 0, ${opacity})`;

            }

        },
        {
            passive: true
        }
    );


    /* =========================
       MOBILE SWIPE END
       ========================= */

    lightbox.addEventListener(
        'touchend',
        function() {

            if (!dragging) {
                return;
            }

            dragging = false;


            const deltaX =
                currentX - startX;

            const deltaY =
                currentY - startY;


            /*
               SWIPE LEFT
               */

            if (
                Math.abs(deltaX) >
                    Math.abs(deltaY) &&
                Math.abs(deltaX) > 70
            ) {

                lightboxImage.style.transition =
                    'transform 0.18s ease';

                lightboxImage.style.transform =
                    `translateX(${
                        deltaX > 0
                            ? '100vw'
                            : '-100vw'
                    }) scale(0.96)`;


                setTimeout(
                    function() {

                        if (deltaX < 0) {
                            showNext();
                        } else {
                            showPrevious();
                        }

                        lightboxImage.style.transition =
                            'none';

                        lightboxImage.style.transform =
                            'translateX(0) scale(0.94)';

                        requestAnimationFrame(
                            function() {

                                lightboxImage.style.transition =
                                    'transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1)';

                                lightboxImage.style.transform =
                                    'translateX(0) scale(1)';

                            }
                        );

                    },
                    180
                );

                return;
            }


            /*
               SWIPE DOWN = CLOSE
            */

            if (
                deltaY > 110 &&
                deltaY > Math.abs(deltaX)
            ) {

                lightboxImage.style.transition =
                    'transform 0.22s ease';

                lightboxImage.style.transform =
                    'translateY(100vh) scale(0.8)';

                lightbox.style.transition =
                    'opacity 0.22s ease';

                lightbox.style.opacity =
                    '0';


                setTimeout(
                    function() {

                        closeLightbox();

                        setTimeout(
                            function() {

                                lightboxImage.style.transform =
                                    '';

                                lightboxImage.style.transition =
                                    '';

                                lightbox.style.opacity =
                                    '';

                                lightbox.style.transition =
                                    '';

                                lightbox.style.background =
                                    'rgba(0, 0, 0, 0.98)';

                            },
                            50
                        );

                    },
                    220
                );

            }


            /*
               SNAP BACK
            */

            else {

                lightboxImage.style.transition =
                    'transform 0.25s ease';

                lightboxImage.style.transform =
                    'translateY(0) translateX(0) scale(1)';

                lightbox.style.transition =
                    'background 0.25s ease';

                lightbox.style.background =
                    'rgba(0, 0, 0, 0.98)';

            }

        },
        {
            passive: true
        }
    );


    /* =========================
       TOUCH CANCEL
       ========================= */

    lightbox.addEventListener(
        'touchcancel',
        function() {

            dragging = false;

            lightboxImage.style.transition =
                'transform 0.25s ease';

            lightboxImage.style.transform =
                'translateY(0) translateX(0) scale(1)';

            lightbox.style.background =
                'rgba(0, 0, 0, 0.98)';

        }
    );

</script>
