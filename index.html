    * {

    html {
        scroll-behavior: smooth;

        padding: 40px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background: #ffffff;
        color: #111111;

        opacity: 0;

        animation:
            pageFadeIn
            0.7s
            ease
            forwards;
    }

    @keyframes pageFadeIn {

        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }

    }


    /* =========================
       HEADER
    ========================= */

    header {
        max-width: 1200px;
        margin: 0 auto 80px;
    }

    h1 {
        font-size: 32px;
        font-weight: 500;
        margin: 0 0 8px;
    }

    .subtitle {
        font-size: 16px;
        color: #555555;
        margin-bottom: 10px;
    }

    .contact {
        font-size: 13px;
        color: #777777;
    }

    .contact a {
        color: #555555;
        text-decoration: none;
    }

    .contact a:hover {
        color: #111111;
    }


    /* =========================
       MAIN
    ========================= */

    main {
        max-width: 1200px;
        margin: auto;
    }

    section {
        margin-bottom: 100px;
    }

    h2 {
        font-size: 18px;
        font-weight: 500;
        margin: 0 0 30px;
    }


    /* =========================
       GALLERY
    ========================= */

    .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .gallery img {
        width: 100%;
        height: auto;
        display: block;

        cursor: pointer;

        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;

        -webkit-tap-highlight-color: transparent;

        transition:
            opacity 0.18s ease,
            transform 0.12s ease;
    }

    .gallery img:hover {
        opacity: 0.88;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        max-width: 1200px;

        margin:

            auto

        font-size: 14px;
        color: #777777;
    }

    footer a {
        color: #111111;
        text-decoration: none;
    }

    footer a:hover {
        text-decoration: underline;
    }

    .ai-note {
        margin-top: 18px;

        font-size: 11px;
        line-height: 1.5;

        color: #999999;
    }

    .copyright {
        margin-top: 12px;
    }
