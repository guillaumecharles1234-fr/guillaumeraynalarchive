
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7f4">

<title>Guillaume Raynal — Concept Art · Illustration</title>
<meta name="description" content="Portfolio of Guillaume Raynal, concept art and illustration.">

<style>
* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: #f8f7f4;
  color: #222;
  font-family: Arial, Helvetica, sans-serif;
}

body.lightbox-open {
  overflow: hidden;
}

header,
.gallery,
footer {
  width: 100%;
  max-width: 1156px;
  margin-inline: auto;
}

header {
  padding: 48px 28px 32px;
}

h1 {
  margin: 0;
  font-size: clamp(25px, 3vw, 28px);
  font-weight: 500;
  letter-spacing: -0.7px;
}

.subtitle {
  margin-top: 7px;
  color: #777;
  font-size: 14px;
}

.contact {
  margin-top: 18px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.email {
  color: inherit;
  user-select: text;
}

/* Category navigation */

.navigation {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  margin-top: 32px;
}

.navigation button {
  padding: 0;
  border: 0;
  background: none;
  color: #888;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: color 0.2s ease;
}

.navigation button:hover {
  color: #222;
}

.navigation button.active {
  color: #222;
  font-weight: 600;
}

.navigation button:focus-visible {
  outline: 2px solid #555;
  outline-offset: 5px;
}

/* Single-column gallery */

.gallery {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  padding: 0 28px 60px;
}

.gallery img {
  display: block;
  width: 100%;
  height: auto;
  cursor: pointer;
  opacity: 0;
  animation: fadeIn 0.5s ease forwards;
  -webkit-tap-highlight-color: transparent;
}

.gallery img:hover {
  opacity: 0.88;
}

.gallery img:focus-visible {
  outline: 2px solid #555;
  outline-offset: 4px;
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}

footer {
  padding: 0 28px 35px;
  color: #888;
  font-size: 12px;
  line-height: 1.8;
}

/* Full-screen image viewer */

#lightbox {
  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  background: rgba(15, 15, 15, 0.95);
  align-items: center;
  justify-content: center;
  padding: 54px 24px 24px;
  touch-action: pan-y;
}

#lightbox.open {
  display: flex;
}

#lightbox-image {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  cursor: pointer;
}

#lightbox-close {
  position: absolute;
  top: 12px;
  right: 18px;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: white;
  background: transparent;
  border: 0;
  border-radius: 4px;
  font-size: 32px;
  font-weight: 300;
  cursor: pointer;
}

#lightbox-close:hover {
  background: rgba(255, 255, 255, 0.12);
}

#lightbox-close:focus-visible {
  outline: 2px solid white;
  outline-offset: 2px;
}

@media (max-width: 650px) {
  header {
    padding: 32px 18px 26px;
  }

  .navigation {
    gap: 20px;
    margin-top: 26px;
  }

  .gallery {
    gap: 18px;
    padding: 0 18px 40px;
  }

  footer {
    padding: 0 18px 28px;
  }

  #lightbox {
    padding: 52px 10px 16px;
  }

  #lightbox-close {
    top: 5px;
    right: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<header>
  <h1>Guillaume Raynal</h1>
  <div class="subtitle">Concept Art · Illustration</div>

  <div class="contact">
    M : <span class="email">guillaumeraynal.contact@gmail.com</span>
  </div>

  <nav class="navigation" aria-label="Portfolio categories">
    <button class="active" data-category="all"
            aria-pressed="true">All</button>
    <button data-category="illustration"
            aria-pressed="false">Illustration</button>
    <button data-category="studies"
            aria-pressed="false">Studies</button>
    <button data-category="sketches"
            aria-pressed="false">Sketches</button>
  </nav>
</header>

<main class="gallery" id="gallery"
      aria-label="Portfolio gallery"></main>

<footer>
  <div>All work shown here was created without generative AI.</div>
  <div>© 2026 Guillaume Raynal</div>
</footer>

<div id="lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="Image viewer">

  <button id="lightbox-close" type="button"
          aria-label="Close image viewer">&times;</button>

  <img id="lightbox-image" src="" alt="">
</div>

<script>

// Image counts
const categories = {
  illustration: 7,
  studies: 25,
  sketches: 64
};

const gallery = document.getElementById('gallery');
const navigationButtons =
  document.querySelectorAll('.navigation button');

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightbox-image');
const closeButton = document.getElementById('lightbox-close');

let previousFocus = null;

// Create image list
function getImages(category) {
  let images = [];

  const selectedCategories =
    category === 'all'
      ? ['illustration', 'studies', 'sketches']
      : [category];

  selectedCategories.forEach(name => {
    for (let i = categories[name]; i >= 1; i--) {
      images.push({
        src: `images/${name}/${i}.jpg`,
        category: name,
        number: i
      });
    }
  });

  return images;
}

// Display gallery
function renderGallery(category = 'all') {
  gallery.innerHTML = '';

  const images = getImages(category);
  const fragment = document.createDocumentFragment();

  images.forEach((item, index) => {
    const image = document.createElement('img');

    image.src = item.src;
    image.alt = `${item.category} ${item.number}`;
    image.loading = 'lazy';
    image.decoding = 'async';
    image.tabIndex = 0;
    image.setAttribute('role', 'button');
    image.setAttribute('aria-label', 'Enlarge artwork');

    image.style.animationDelay =
      `${Math.min(index * 0.04, 0.4)}s`;

    image.addEventListener('click', () => {
      openLightbox(image);
    });

    image.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openLightbox(image);
      }
    });

    fragment.appendChild(image);
  });

  gallery.appendChild(fragment);
}

// Category navigation
navigationButtons.forEach(button => {
  button.addEventListener('click', () => {
    const category = button.dataset.category;

    navigationButtons.forEach(item => {
      const active = item === button;

      item.classList.toggle('active', active);
      item.setAttribute('aria-pressed', active);
    });

    renderGallery(category);
  });
});

// Lightbox
function openLightbox(image) {
  previousFocus = image;

  lightboxImage.src = image.src;
  lightboxImage.alt = image.alt;

  lightbox.classList.add('open');
  document.body.classList.add('lightbox-open');

  closeButton.focus();
}

function closeLightbox() {
  if (!lightbox.classList.contains('open')) return;

  lightbox.classList.remove('open');
  document.body.classList.remove('lightbox-open');

  lightboxImage.src = '';
  lightboxImage.alt = '';

  if (previousFocus) {
    previousFocus.focus();
  }
}

closeButton.addEventListener('click', closeLightbox);

lightbox.addEventListener('click', event => {
  if (event.target === lightbox ||
      event.target === lightboxImage) {
    closeLightbox();
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    closeLightbox();
  }
});

// Close lightbox by swiping down
let touchStartY = 0;

lightbox.addEventListener('touchstart', event => {
  touchStartY = event.changedTouches[0].screenY;
}, { passive: true });

lightbox.addEventListener('touchend', event => {
  const touchEndY = event.changedTouches[0].screenY;

  if (touchEndY - touchStartY > 120) {
    closeLightbox();
  }
}, { passive: true });

// Initial gallery
renderGallery('all');

</script>

</body>
</html>
