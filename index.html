<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Name — Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ef;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 25px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 500;
    }

    header p {
      margin-top: 10px;
      color: #666;
      font-size: 16px;
    }

    .portfolio-folders {
      width: calc(100% - 50px);
      max-width: 1000px;
      margin: 30px auto 80px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .folder-card {
      position: relative;
      display: block;
      width: 100%;
      height: 280px;
      overflow: hidden;
      background: #111;
      text-decoration: none;
    }

    .folder-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .folder-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.75),
        rgba(0, 0, 0, 0.05)
      );
    }

    .folder-title {
      position: absolute;
      z-index: 2;
      left: 30px;
      bottom: 25px;

      color: white;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .folder-card:hover img {
      transform: scale(1.04);
    }

    footer {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 25px 50px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      header {
        padding: 35px 20px 20px;
      }

      header h1 {
        font-size: 26px;
      }

      .portfolio-folders {
        width: calc(100% - 40px);
        margin-top: 20px;
        gap: 15px;
      }

      .folder-card {
        height: 190px;
      }

      .folder-title {
        left: 20px;
        bottom: 18px;
        font-size: 23px;
      }

    }
  </style>
</head>

<body>

  <header>
    <h1>Your Name</h1>
    <p>Illustration · Concept Art · Studies</p>
  </header>


  <main class="portfolio-folders">

    <!-- CONCEPT ART -->
    <a href="concept.html" class="folder-card">
      <img src="images/concept-cover.jpg" alt="Concept Art">
      <div class="folder-title">Concept Art</div>
    </a>


    <!-- ILLUSTRATION -->
    <a href="illustration.html" class="folder-card">
      <img src="images/illustration-cover.jpg" alt="Illustration">
      <div class="folder-title">Illustration</div>
    </a>


    <!-- STUDIES -->
    <a href="studies.html" class="folder-card">
      <img src="images/studies-cover.jpg" alt="Studies">
      <div class="folder-title">Studies</div>
    </a>


    <!-- SKETCHBOOK -->
    <a href="sketchbook.html" class="folder-card">
      <img src="images/sketchbook-cover.jpg" alt="Sketchbook">
      <div class="folder-title">Sketchbook</div>
    </a>

  </main>


  <footer>
    © 2026 Your Name
  </footer>

</body>
</html>
