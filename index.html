<head>

```
<meta charset="UTF-8">

<title>Guillaume Raynal — Concept Art / Illustration</title>


<style>

    /* =========================
       BASIC
    ========================= */

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 40px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background: #ffffff;
        color: #111111;

        opacity: 0;

        animation:
            pageFadeIn
            0.7s
            ease
            forwards;
    }

    @keyframes pageFadeIn {

        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }

    }


    /* =========================
       HEADER
    ========================= */

    header {
        max-width: 1200px;

        margin:
            0
            auto
            80px;
    }

    h1 {
        font-size: 32px;
        font-weight: 500;

        margin:
            0
            0
            8px;
    }

    .subtitle {
        font-size: 16px;
        color: #555555;

        margin-bottom: 10px;
    }

    .contact {
        font-size: 13px;
        color: #777777;
    }

    .contact a {
        color: #555555;
        text-decoration: none;

        transition:
            color 0.2s ease;
    }

    .contact a:hover {
        color: #111111;
    }


    /* =========================
       MAIN
    ========================= */

    main {
        max-width: 1200px;
        margin: auto;
    }

    section {
        margin-bottom: 100px;
    }

    h2 {
        font-size: 18px;
        font-weight: 500;

        margin:
            0
            0
            30px;
    }


    /* =========================
       GALLERY
    ========================= */

    .gallery {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 20px;
    }

    .gallery img {
        width: 100%;
        height: auto;

        display: block;

        cursor: pointer;

        -webkit-tap-highlight-color:
            transparent;

        user-select: none;
        -webkit-user-select: none;

        -webkit-user-drag: none;

        transition:
            opacity 0.18s ease;
    }

    .gallery img:hover {
        opacity: 0.88;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        max-width: 1200px;

        margin:
            100px
            auto
            30px;

        font-size: 14px;
        color: #777777;
    }

    footer a {
        color: #111111;
        text-decoration: none;
    }

    footer a:hover {
        text-decoration: underline;
    }

    .ai-note {
        margin-top: 18px;

        font-size: 11px;
        line-height: 1.5;

        color: #999999;
    }

    .copyright {
        margin-top: 12px;
    }


    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {
        position: fixed;

        z-index: 1000;

        inset: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        padding: 20px;

        background:
            rgba(0, 0, 0, 0.97);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
            opacity 0.25s ease,
            visibility 0.25s ease;

        overflow: hidden;

        touch-action: none;
    }

    .lightbox.active {
        opacity: 1;

        visibility: visible;

        pointer-events: auto;
    }


    /* =========================
       LIGHTBOX IMAGE
    ========================= */

    .lightbox img {
        display: block;

        max-width:
            calc(100vw - 40px);

        max-height:
            calc(100vh - 40px);

        width: auto;
        height: auto;

        object-fit: contain;

        user-select: none;
        -webkit-user-select: none;

        -webkit-touch-callout: none;
        -webkit-user-drag: none;

        transform:
            scale(0.94);

        transition:
            transform
            0.28s
            cubic-bezier(
                0.2,
                0.8,
                0.2,
                1
            );
    }

    .lightbox.active img {
        transform:
            scale(1);
    }


    /* =========================
       CLOSE BUTTON
    ========================= */

    .lightbox-close {
        position: absolute;

        top: 15px;
        right: 20px;

        width: 50px;
        height: 50px;

        display: flex;

        align-items: center;
        justify-content: center;

        color: white;

        font-size: 36px;
        font-weight: 300;

        line-height: 1;

        cursor: pointer;

        user-select: none;

        z-index: 10;

        -webkit-tap-highlight-color:
            transparent;

        border-radius: 50%;

        transition:
            background 0.18s ease,
            transform 0.18s ease;
    }

    .lightbox-close:hover {
        background:
            rgba(255, 255, 255, 0.10);

        transform:
            scale(1.05);
    }


    /* =========================
       LIGHTBOX COUNTER
    ========================= */

    .lightbox-counter {
        position: absolute;

        left: 50%;
        bottom: 20px;

        transform:
            translateX(-50%);

        color:
            rgba(255, 255, 255, 0.65);

        font-size: 12px;

        letter-spacing: 0.04em;

        pointer-events: none;

        z-index: 10;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        body {
            padding: 20px;
        }

        header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 28px;
        }

        .subtitle {
            font-size: 15px;
        }

        .contact {
            font-size: 12px;
        }


        /* =========================
           MOBILE GALLERY
        ========================= */

        .gallery {
            grid-template-columns: 1fr;

            gap: 30px;
        }

        .gallery img {
            transition:
                opacity 0.12s ease,
                transform 0.12s ease;
        }

        .gallery img:active {
            opacity: 0.78;

            transform:
                scale(0.995);
        }


        section {
            margin-bottom: 70px;
        }


        /* =========================
           MOBILE FOOTER
        ========================= */

        footer {
            margin-top: 70px;
            margin-bottom: 20px;
        }


        /* =========================
           MOBILE LIGHTBOX
        ========================= */

        .lightbox {

            width: 100vw;
            height: 100dvh;

            min-height: 100dvh;

            inset: 0;

            padding:
                env(safe-area-inset-top)
                0
                env(safe-area-inset-bottom)
                0;

            background:
                rgba(0, 0, 0, 0.98);
        }


        .lightbox img {

            max-width: 100vw;

            max-height:
                calc(
                    100dvh
                    -
                    env(safe-area-inset-top)
                    -
                    env(safe-area-inset-bottom)
                    -
                    20px
                );

            width: auto;
            height: auto;

            transform:
                scale(0.92);

            transition:
                transform
                0.32s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                );
        }

        .lightbox.active img {
            transform:
                scale(1);
        }


        /* =========================
           MOBILE CLOSE
        ========================= */

        .lightbox-close {

            top:
                calc(
                    8px
                    +
                    env(safe-area-inset-top)
                );

            right: 8px;

            width: 54px;
            height: 54px;

            font-size: 34px;
        }


        /* =========================
           MOBILE COUNTER
        ========================= */

        .lightbox-counter {

            bottom:
                calc(
                    10px
                    +
                    env(safe-area-inset-bottom)
                );

            font-size: 11px;
        }

    }


    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

        html {
            scroll-behavior: auto;
        }

        body {
            animation: none;
            opacity: 1;
        }

        .lightbox,
        .lightbox img,
        .gallery img,
        .lightbox-close {
            transition: none;
        }

    }

</style>
