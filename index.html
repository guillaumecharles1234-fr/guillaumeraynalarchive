
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Guillaume Raynal — Concept Art and Illustration portfolio.">

<title>Guillaume Raynal — Concept Art / Illustration</title>

<style>
:root {
    --background: #f5f3ee;
    --foreground: #292824;
    --muted: #85827b;
    --accent: #45433e;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--background);
    color: var(--foreground);
    font-family: Arial, Helvetica, sans-serif;
    padding: 42px 5% 30px;
    -webkit-font-smoothing: antialiased;
}

/* Header */

header {
    margin-bottom: 48px;
}

h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.65px;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 9px;
}

.email {
    display: inline-block;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
}

.email:hover {
    color: var(--foreground);
}

/* Navigation */

nav {
    display: flex;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
    margin-bottom: 32px;
}

nav button {
    appearance: none;
    border: none;
    background: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 0 0 4px;
    transition: color 0.2s ease;
}

nav button:hover,
nav button.active {
    color: var(--foreground);
}

nav button.active {
    box-shadow: 0 1px 0 var(--foreground);
}

button:focus-visible,
a:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 4px;
}

/* Gallery */

.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 25px;
    row-gap: 38px;
    align-items: start;
}

.artwork {
    min-width: 0;
    cursor: pointer;
    overflow: hidden;
}

.artwork img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: opacity 0.3s ease;
}

.artwork:hover img {
    opacity: 0.88;
}

.artwork img:not([src]) {
    visibility: hidden;
}

.image-error {
    display: none;
    color: var(--muted);
    font-size: 12px;
    padding: 25px 0;
}

/* Footer */

footer {
    margin-top: 75px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
}

footer p {
    margin: 0;
}

/* Lightbox */

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(24, 24, 22, 0.97);
    align-items: center;
    justify-content: center;
    padding: 50px;
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    display: block;
    max-width: 88vw;
    max-height: 86vh;
    object-fit: contain;
    user-select: none;
}

.lightbox button {
    position: absolute;
    border: none;
    background: none;
    color: rgba(255, 255, 255, 0.8);
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-weight: 300;
    font-size: 30px;
    padding: 15px;
    transition: color 0.2s ease;
}

.lightbox button:hover {
    color: white;
}

.close {
    top: 14px;
    right: 22px;
}

.prev {
    left: 14px;
}

.next {
    right: 14px;
}

/* Mobile */

@media (max-width: 650px) {
    body {
        padding: 28px 5% 25px;
    }

    header {
        margin-bottom: 38px;
    }

    .gallery {
        grid-template-columns: 1fr;
        row-gap: 26px;
    }

    nav {
        gap: 20px;
        margin-bottom: 26px;
    }

    .lightbox {
        padding: 25px;
    }

    .lightbox img {
        max-width: 94vw;
        max-height: 80vh;
    }

    .prev {
        left: 0;
    }

    .next {
        right: 0;
    }

    footer {
        margin-top: 55px;
    }
}

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<header>
    <h1>Guillaume Raynal</h1>
    <p class="subtitle">Concept Art / Illustration</p>

    <a class="email" href="mailto:guillaumeraynal.contact@gmail.com">
        guillaumeraynal.contact@gmail.com
    </a>
</header>

<nav id="filters" aria-label="Portfolio categories">
    <button class="active" data-category="all" aria-pressed="true">All</button>
    <button data-category="illustration" aria-pressed="false">Illustration</button>
    <button data-category="studies" aria-pressed="false">Studies</button>
    <button data-category="gestures" aria-pressed="false">Gestures</button>
</nav>

<main class="gallery" id="gallery"></main>

<footer>
    <p>All work shown here has been done without generative AI.</p>
    <p>© 2026 Guillaume Raynal</p>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="close" id="close" aria-label="Close image">×</button>
    <button class="prev" id="prev" aria-label="Previous image">‹</button>
    <img id="lightboxImage" src="" alt="">
    <button class="next" id="next" aria-label="Next image">›</button>
</div>

<script>
const categories = {
    illustration: {
        first: 7,
        last: 1
    },
    studies: {
        first: 27,
        last: 1
    },
    gestures: {
        first: 48,
        last: 6
    }
};

const gallery = document.getElementById("gallery");
const filters = document.querySelectorAll("#filters button");

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");

let currentImages = [];
let currentIndex = 0;
let previousFocus = null;

function getImages(category) {
    const data = categories[category];
    const images = [];

    for (let i = data.first; i >= data.last; i--) {
        images.push({
            category,
            src: `${category}/${i}.webp`
        });
    }

    return images;
}

function renderGallery(category = "all") {
    gallery.innerHTML = "";

    let images = [];

    if (category === "all") {
        Object.keys(categories).forEach(key => {
            images = images.concat(getImages(key));
        });
    } else {
        images = getImages(category);
    }

    // Ensure each image path appears only once.
    const uniqueImages = [
        ...new Map(images.map(image => [image.src, image])).values()
    ];

    uniqueImages.forEach((item, index) => {
        const container = document.createElement("div");
        container.className = "artwork";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = `${item.category} ${item.src.split("/").pop()}`;
        img.loading = "lazy";
        img.decoding = "async";

        img.addEventListener("click", () => {
            currentImages = uniqueImages;
            currentIndex = index;
            openLightbox();
        });

        img.addEventListener("error", () => {
            container.remove();
        });

        container.appendChild(img);
        gallery.appendChild(container);
    });
}

// Category filters

filters.forEach(button => {
    button.addEventListener("click", () => {
        filters.forEach(item => {
            item.classList.remove("active");
            item.setAttribute("aria-pressed", "false");
        });

        button.classList.add("active");
        button.setAttribute("aria-pressed", "true");

        renderGallery(button.dataset.category);
    });
});

// Lightbox

function openLightbox() {
    previousFocus = document.activeElement;
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
    updateLightbox();
    document.getElementById("close").focus();
}

function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImage.src = "";
    document.body.style.overflow = "";

    if (previousFocus) {
        previousFocus.focus();
    }
}

function updateLightbox() {
    const item = currentImages[currentIndex];

    if (!item) return;

    lightboxImage.src = item.src;
    lightboxImage.alt = `${item.category} artwork`;
}

function showNext() {
    currentIndex = (currentIndex + 1) % currentImages.length;
    updateLightbox();
}

function showPrevious() {
    currentIndex =
        (currentIndex - 1 + currentImages.length) % currentImages.length;

    updateLightbox();
}

document.getElementById("close").addEventListener("click", closeLightbox);
document.getElementById("next").addEventListener("click", showNext);
document.getElementById("prev").addEventListener("click", showPrevious);

lightbox.addEventListener("click", event => {
    if (event.target === lightbox) {
        closeLightbox();
    }
});

document.addEventListener("keydown", event => {
    if (!lightbox.classList.contains("open")) return;

    if (event.key === "Escape") closeLightbox();
    if (event.key === "ArrowRight") showNext();
    if (event.key === "ArrowLeft") showPrevious();
});

// Swipe down to close on mobile

let touchStartY = 0;

lightbox.addEventListener("touchstart", event => {
    touchStartY = event.touches[0].clientY;
}, { passive: true });

lightbox.addEventListener("touchend", event => {
    const touchEndY = event.changedTouches[0].clientY;

    if (touchEndY - touchStartY > 100) {
        closeLightbox();
    }
}, { passive: true });

// Initial gallery

renderGallery();

</script>

</body>
</html>
