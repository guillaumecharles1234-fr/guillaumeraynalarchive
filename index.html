
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guillaume Raynal — Concept Art / Illustration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      font-size: 24px;
      font-weight: normal;
      margin: 0 0 8px;
    }

    header p {
      color: #666;
      margin: 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
    }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.94);
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: zoom-out;
    }

    #lightbox img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    @media (max-width: 650px) {
      body {
        padding: 16px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Guillaume Raynal</h1>
    <p>Concept Art / Illustration</p>
  </header>

  <main class="gallery" id="gallery"></main>

  <div id="lightbox">
    <img id="lightbox-image" src="" alt="">
  </div>

  <script>
    // AJOUTE LES NOUVELLES IMAGES ICI.
    // La première image de cette liste apparaît en premier.
    // Exemple : "Studies/25.jpg",

    const newImages = [
      // "Studies/25.jpg",
    ];

    // Images déjà présentes sur ton site.
    // Les fichiers originaux restent dans leurs dossiers.
    const existingImages = [
      ...Array.from({ length: 24 }, (_, i) =>
        `Studies/${i + 1}.jpg`
      ),
      ...Array.from({ length: 21 }, (_, i) =>
        `Sketches/${i + 1}.jpg`
      )
    ];

    const imageFiles = [
      ...newImages,
      ...existingImages
    ];

    const gallery = document.getElementById("gallery");

    imageFiles.forEach((file) => {
      const img = document.createElement("img");
      img.src = file;
      img.alt = "Concept art / Illustration";
      img.loading = "lazy";

      img.onerror = () => img.remove();

      img.addEventListener("click", () => {
        document.getElementById("lightbox-image").src = file;
        document.getElementById("lightbox").style.display = "flex";
      });

      gallery.appendChild(img);
    });

    const lightbox = document.getElementById("lightbox");

    lightbox.addEventListener("click", () => {
      lightbox.style.display = "none";
      document.getElementById("lightbox-image").src = "";
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        lightbox.style.display = "none";
        document.getElementById("lightbox-image").src = "";
      }
    });
  </script>
</body>
</html>
