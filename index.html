<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Guillaume Raynal — Concept Art / Illustration</title>

    <style>

        /* =========================
           BASIC
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;

            opacity: 0;
            animation: pageFadeIn 0.7s ease forwards;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================
           HEADER
        ========================= */

        header {
            max-width: 1200px;
            margin: 0 auto 80px;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            margin: 0 0 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #555555;
            margin-bottom: 8px;
        }

        .note {
            font-size: 12px;
            color: #888888;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1200px;
            margin: auto;
        }

        section {
            margin-bottom: 100px;
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 30px;
        }


        /* =========================
           GALLERY
        ========================= */

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            max-width: 1200px;
            margin: 100px auto 30px;
            font-size: 14px;
            color: #777777;
        }

        footer a {
            color: #111111;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .copyright {
            margin-top: 12px;
        }


        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            z-index: 1000;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.97);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            overflow: hidden;

            touch-action: none;

            padding: 20px;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }


        /* =========================
           LIGHTBOX IMAGE
        ========================= */

        .lightbox img {
            display: block;

            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 40px);

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;

            transform: scale(0.94);

            transition:
                transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .lightbox.active img {
            transform: scale(1);
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .lightbox-close {
            position: absolute;

            top: 15px;
            right: 20px;

            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 36px;
            font-weight: 300;

            line-height: 1;

            cursor: pointer;
            user-select: none;

            z-index: 10;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            header {
                margin-bottom: 50px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 15px;
            }

            .note {
                font-size: 11px;
                line-height: 1.5;
            }


            /* One column */

            .gallery {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            section {
                margin-bottom: 70px;
            }


            /* Footer */

            footer {
                margin-top: 70px;
                margin-bottom: 20px;
            }


            /* =========================
               MOBILE LIGHTBOX
               ========================= */

            .lightbox {

                /*
                   Use the actual viewport including
                   the phone's safe areas.
                */

                width: 100vw;
                height: 100dvh;

                min-height: 100dvh;

                inset: 0;

                padding:
                    env(safe-area-inset-top)
                    0
                    env(safe-area-inset-bottom)
                    0;

                background: rgba(0, 0, 0, 0.98);
            }


            .lightbox img {

                /*
                   Almost the entire available phone screen.
                   The artwork keeps its original proportions.
                */

                max-width: 100vw;

                max-height:
                    calc(
                        100dvh
                        - env(safe-area-inset-top)
                        - env(safe-area-inset-bottom)
                        - 10px
                    );

                width: auto;
                height: auto;

                transform: scale(0.92);

                transition:
                    transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .lightbox.active img {
                transform: scale(1);
            }


            /* Close button */

            .lightbox-close {

                top:
                    calc(
                        8px + env(safe-area-inset-top)
                    );

                right: 8px;

                width: 54px;
                height: 54px;

                font-size: 34px;
            }

        }


        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            body {
                animation: none;
                opacity: 1;
            }

            .lightbox,
            .lightbox img {
                transition: none;
            }
        }

    </style>
</head>

<!-- =========================
     LIGHTBOX
========================== -->

<div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
>

    <span
        class="lightbox-close"
        id="lightboxClose"
        aria-label="Close image"
        role="button"
    >
        &times;
    </span>

    <img
        id="lightboxImage"
        src=""
        alt=""
    >

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script>

    const galleryImages =
        document.querySelectorAll('.gallery img');

    const lightbox =
        document.getElementById('lightbox');

    const lightboxImage =
        document.getElementById('lightboxImage');

    const lightboxClose =
        document.getElementById('lightboxClose');


    /* =========================
       OPEN
       ========================= */

    function openLightbox(image) {

        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;

        lightbox.classList.add('active');

        lightbox.setAttribute('aria-hidden', 'false');

        document.body.style.overflow = 'hidden';

    }


    /* =========================
       CLOSE
       ========================= */

    function closeLightbox() {

        lightbox.classList.remove('active');

        lightbox.setAttribute('aria-hidden', 'true');

        document.body.style.overflow = '';

        setTimeout(function() {

            if (!lightbox.classList.contains('active')) {

                lightboxImage.src = '';

            }

        }, 300);

    }


    /* =========================
       OPEN IMAGE
       ========================= */

    galleryImages.forEach(function(image) {

        image.addEventListener('click', function() {

            openLightbox(image);

        });

    });


    /* =========================
       BACKGROUND CLICK
       ========================= */

    lightbox.addEventListener('click', function(event) {

        if (event.target === lightbox) {

            closeLightbox();

        }

    });


    /* =========================
       CLOSE BUTTON
       ========================= */

    lightboxClose.addEventListener('click', function(event) {

        event.stopPropagation();

        closeLightbox();

    });


    /* =========================
       ESCAPE
       ========================= */

    document.addEventListener('keydown', function(event) {

        if (
            event.key === 'Escape' &&
            lightbox.classList.contains('active')
        ) {

            closeLightbox();

        }

    });


    /* =========================
       MOBILE SWIPE DOWN
       ========================= */

    let startY = 0;
    let currentY = 0;
    let dragging = false;


    lightbox.addEventListener(
        'touchstart',
        function(event) {

            if (window.innerWidth > 700) {
                return;
            }

            if (!lightbox.classList.contains('active')) {
                return;
            }

            startY = event.touches[0].clientY;
            currentY = startY;

            dragging = true;

            lightboxImage.style.transition = 'none';
            lightbox.style.transition = 'none';

        },
        { passive: true }
    );


    lightbox.addEventListener(
        'touchmove',
        function(event) {

            if (!dragging) {
                return;
            }

            currentY = event.touches[0].clientY;

            const distance = currentY - startY;


            if (distance > 0) {

                const movement =
                    Math.min(distance, 350);

                const scale =
                    Math.max(
                        0.78,
                        1 - movement / 1400
                    );

                lightboxImage.style.transform =
                    `translateY(${movement}px) scale(${scale})`;


                const opacity =
                    Math.max(
                        0.35,
                        0.98 - movement / 450
                    );

                lightbox.style.background =
                    `rgba(0, 0, 0, ${opacity})`;

            }

        },
        { passive: true }
    );


    lightbox.addEventListener(
        'touchend',
        function() {

            if (!dragging) {
                return;
            }

            dragging = false;

            const distance =
                currentY - startY;


            /* CLOSE */

            if (distance > 110) {

                lightboxImage.style.transition =
                    'transform 0.22s ease';

                lightboxImage.style.transform =
                    'translateY(100vh) scale(0.8)';

                lightbox.style.transition =
                    'opacity 0.22s ease';

                lightbox.style.opacity = '0';


                setTimeout(function() {

                    closeLightbox();

                    setTimeout(function() {

                        lightboxImage.style.transform = '';
                        lightboxImage.style.transition = '';

                        lightbox.style.opacity = '';
                        lightbox.style.transition = '';

                        lightbox.style.background =
                            'rgba(0, 0, 0, 0.98)';

                    }, 50);

                }, 220);

            }


            /* SNAP BACK */

            else {

                lightboxImage.style.transition =
                    'transform 0.25s ease';

                lightboxImage.style.transform =
                    'translateY(0) scale(1)';

                lightbox.style.transition =
                    'background 0.25s ease';

                lightbox.style.background =
                    'rgba(0, 0, 0, 0.98)';

            }

        },
        { passive: true }
    );


    /* =========================
       TOUCH CANCEL
       ========================= */

    lightbox.addEventListener(
        'touchcancel',
        function() {

            dragging = false;

            lightboxImage.style.transition =
                'transform 0.25s ease';

            lightboxImage.style.transform =
                'translateY(0) scale(1)';

            lightbox.style.background =
                'rgba(0, 0, 0, 0.98)';

        }
    );

</script>
