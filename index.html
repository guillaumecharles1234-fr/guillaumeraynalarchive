
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guillaume Raynal — Concept Art / Illustration</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f5f3ee;
    color: #242424;
    font-family: Arial, Helvetica, sans-serif;
    padding: 38px 5%;
}

header {
    margin-bottom: 45px;
}

h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 13px;
    color: #777;
}

/* Navigation */

nav {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

nav button {
    border: none;
    background: none;
    color: #888;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
}

nav button:hover,
nav button.active {
    color: #222;
}

/* Gallery */

.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 35px 25px;
}

.artwork {
    cursor: pointer;
    min-width: 0;
}

.artwork img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: opacity 0.25s ease;
}

.artwork:hover img {
    opacity: 0.88;
}

/* Footer */

footer {
    margin-top: 65px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    font-size: 12px;
    color: #888;
}

footer a {
    color: #777;
    text-decoration: none;
}

footer a:hover {
    color: #222;
}

/* Lightbox */

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(20, 20, 20, 0.96);
    align-items: center;
    justify-content: center;
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    max-width: 88vw;
    max-height: 88vh;
    object-fit: contain;
}

.lightbox button {
    position: absolute;
    border: none;
    background: none;
    color: white;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 30px;
    padding: 15px;
}

.close {
    top: 15px;
    right: 25px;
}

.prev {
    left: 15px;
}

.next {
    right: 15px;
}

/* Mobile */

@media (max-width: 650px) {
    body {
        padding: 25px 5%;
    }

    header {
        margin-bottom: 35px;
    }

    .gallery {
        grid-template-columns: 1fr;
        gap: 25px;
    }

    nav {
        gap: 18px;
    }

    .lightbox img {
        max-width: 94vw;
        max-height: 82vh;
    }

    .prev {
        left: 0;
    }

    .next {
        right: 0;
    }
}
</style>
</head>

<body>

<header>
    <h1>Guillaume Raynal</h1>
    <p class="subtitle">Concept Art / Illustration</p>
</header>

<nav id="filters">
    <button class="active" data-category="all">All</button>
    <button data-category="illustration">Illustration</button>
    <button data-category="studies">Studies</button>
    <button data-category="gestures">Gestures</button>
</nav>

<main class="gallery" id="gallery"></main>

<footer>
    <a href="mailto:guillaumeraynal.contact@gmail.com">
        guillaumeraynal.contact@gmail.com
    </a>

    <p>© 2026 Guillaume Raynal</p>

    <p>
        All work shown here has been done without generative AI.
    </p>
</footer>

<div class="lightbox" id="lightbox">
    <button class="close" id="close" aria-label="Close">×</button>
    <button class="prev" id="prev" aria-label="Previous">‹</button>
    <img id="lightboxImage" src="" alt="">
    <button class="next" id="next" aria-label="Next">›</button>
</div>

<script>
const categories = {
    illustration: {
        first: 7,
        last: 1
    },
    studies: {
        first: 27,
        last: 1
    },
    gestures: {
        first: 48,
        last: 6
    }
};

const gallery = document.getElementById("gallery");
const filters = document.querySelectorAll("#filters button");

let currentImages = [];
let currentIndex = 0;

function getImages(category) {
    const data = categories[category];
    const images = [];

    for (let i = data.first; i >= data.last; i--) {
        images.push({
            category: category,
            src: `${category}/${i}.webp`
        });
    }

    return images;
}

function renderGallery(category = "all") {
    gallery.innerHTML = "";

    let images = [];

    if (category === "all") {
        Object.keys(categories).forEach(key => {
            images = images.concat(getImages(key));
        });
    } else {
        images = getImages(category);
    }

    // Remove duplicate image paths
    const uniqueImages = [
        ...new Map(images.map(image => [image.src, image])).values()
    ];

    uniqueImages.forEach((item, index) => {
        const container = document.createElement("div");
        container.className = "artwork";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = `${item.category} artwork ${item.src}`;
        img.loading = "lazy";

        img.addEventListener("click", () => {
            currentImages = uniqueImages;
            currentIndex = index;
            openLightbox();
        });

        container.appendChild(img);
        gallery.appendChild(container);
    });
}

// Category filters

filters.forEach(button => {
    button.addEventListener("click", () => {
        filters.forEach(item => item.classList.remove("active"));
        button.classList.add("active");

        renderGallery(button.dataset.category);
    });
});

// Lightbox

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");

function openLightbox() {
    lightbox.classList.add("open");
    updateLightbox();
}

function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImage.src = "";
}

function updateLightbox() {
    lightboxImage.src = currentImages[currentIndex].src;
}

function showNext() {
    currentIndex = (currentIndex + 1) % currentImages.length;
    updateLightbox();
}

function showPrevious() {
    currentIndex =
        (currentIndex - 1 + currentImages.length) % currentImages.length;
    updateLightbox();
}

document.getElementById("close").addEventListener("click", closeLightbox);
document.getElementById("next").addEventListener("click", showNext);
document.getElementById("prev").addEventListener("click", showPrevious);

lightbox.addEventListener("click", event => {
    if (event.target === lightbox) {
        closeLightbox();
    }
});

document.addEventListener("keydown", event => {
    if (!lightbox.classList.contains("open")) return;

    if (event.key === "Escape") closeLightbox();
    if (event.key === "ArrowRight") showNext();
    if (event.key === "ArrowLeft") showPrevious();
});

// Swipe down to close on mobile

let touchStartY = 0;

lightbox.addEventListener("touchstart", event => {
    touchStartY = event.touches[0].clientY;
}, { passive: true });

lightbox.addEventListener("touchend", event => {
    const touchEndY = event.changedTouches[0].clientY;

    if (touchEndY - touchStartY > 100) {
        closeLightbox();
    }
}, { passive: true });

// Initial gallery

renderGallery();

</script>

</body>
</html>
