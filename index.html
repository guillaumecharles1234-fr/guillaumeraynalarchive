<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guillaume Raynal — Concept Art / Illustration</title>

    <style>

        /* =========================
           BASIC
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 40px;

            font-family: Arial, Helvetica, sans-serif;

            background: #ffffff;
            color: #111111;

            opacity: 0;
            animation: pageFadeIn 0.7s ease forwards;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================
           HEADER
        ========================= */

        header {
            max-width: 1200px;
            margin: 0 auto 80px;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            margin: 0 0 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #555555;
            margin-bottom: 8px;
        }

        .note {
            font-size: 12px;
            color: #888888;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1200px;
            margin: auto;
        }

        section {
            margin-bottom: 100px;
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 30px;
        }


        /* =========================
           GALLERY
        ========================= */

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            max-width: 1200px;
            margin: 100px auto 30px;

            font-size: 14px;
            color: #777777;
        }

        footer a {
            color: #111111;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .copyright {
            margin-top: 12px;
        }


        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;

            z-index: 1000;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background: rgba(0, 0, 0, 0.96);

            opacity: 0;
            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }


        /* =========================
           LIGHTBOX IMAGE
        ========================= */

        .lightbox img {
            display: block;

            max-width: 95vw;
            max-height: 92vh;

            width: auto;
            height: auto;

            object-fit: contain;

            cursor: default;

            transform: scale(0.96);

            transition:
                transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);

            user-select: none;
            -webkit-user-select: none;

            -webkit-touch-callout: none;
        }

        .lightbox.active img {
            transform: scale(1);
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .lightbox-close {
            position: absolute;

            top: 18px;
            right: 25px;

            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;

            font-size: 36px;
            font-weight: 300;

            line-height: 1;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            z-index: 2;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            header {
                margin-bottom: 50px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 15px;
            }

            .note {
                font-size: 11px;
                line-height: 1.5;
            }


            /* Gallery */

            .gallery {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            section {
                margin-bottom: 70px;
            }


            /* Footer */

            footer {
                margin-top: 70px;
                margin-bottom: 20px;
            }


            /* Mobile lightbox */

            .lightbox {
                padding: 10px;

                background: rgba(0, 0, 0, 0.97);

                /*
                   Allows the image to move vertically
                   when swiping down.
                */
                touch-action: none;
            }

            .lightbox img {
                max-width: 100vw;
                max-height: 92vh;

                transform: scale(0.94);
            }

            .lightbox.active img {
                transform: scale(1);
            }


            /* Bigger touch target */

            .lightbox-close {
                top: 8px;
                right: 8px;

                width: 52px;
                height: 52px;

                font-size: 34px;
            }
        }


        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            body {
                animation: none;
                opacity: 1;
            }

            .lightbox,
            .lightbox img {
                transition: none;
            }
        }

    </style>
</head>

<div class="lightbox" id="lightbox">

        id="lightboxClose"
        aria-label="Close image"
        role="button"

    </span>

        id="lightboxImage"
        src=""
        alt=""

<!-- =========================
     JAVASCRIPT
========================== -->

<script>

    const galleryImages =
        document.querySelectorAll('.gallery img');

    const lightbox =
        document.getElementById('lightbox');

    const lightboxImage =
        document.getElementById('lightboxImage');

    const lightboxClose =
        document.getElementById('lightboxClose');


    /* =========================
       OPEN LIGHTBOX
    ========================= */

    function openLightbox(image) {

        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;

        lightbox.classList.add('active');

        document.body.style.overflow = 'hidden';

    }


    /* =========================
       CLOSE LIGHTBOX
    ========================= */

    function closeLightbox() {

        lightbox.classList.remove('active');

        document.body.style.overflow = '';

        /*
           Wait for the closing animation
           before removing the image.
        */

        setTimeout(function() {

            if (!lightbox.classList.contains('active')) {

                lightboxImage.src = '';

            }

        }, 300);

    }


    /* =========================
       CLICK GALLERY IMAGES
    ========================= */

    galleryImages.forEach(function(image) {

        image.addEventListener('click', function() {

            openLightbox(image);

        });

    });


    /* =========================
       CLICK BACKGROUND
    ========================= */

    lightbox.addEventListener('click', function(event) {

        if (event.target === lightbox) {

            closeLightbox();

        }

    });


    /* =========================
       CLOSE BUTTON
    ========================= */

    lightboxClose.addEventListener('click', function(event) {

        event.stopPropagation();

        closeLightbox();

    });


    /* =========================
       ESCAPE KEY
    ========================= */

    document.addEventListener('keydown', function(event) {

        if (event.key === 'Escape') {

            if (lightbox.classList.contains('active')) {

                closeLightbox();

            }

        }

    });


    /* =========================
       MOBILE SWIPE DOWN
    ========================= */

    let touchStartY = 0;
    let touchCurrentY = 0;

    let isDragging = false;


    lightbox.addEventListener(
        'touchstart',
        function(event) {

            if (window.innerWidth > 700) {
                return;
            }

            if (!lightbox.classList.contains('active')) {
                return;
            }

            touchStartY = event.touches[0].clientY;

            touchCurrentY = touchStartY;

            isDragging = true;

            lightboxImage.style.transition = 'none';

        },
        { passive: true }
    );


    lightbox.addEventListener(
        'touchmove',
        function(event) {

            if (!isDragging) {
                return;
            }

            touchCurrentY = event.touches[0].clientY;

            const distance =
                touchCurrentY - touchStartY;

            /*
               Only allow dragging downward.
            */

            if (distance > 0) {

                const movement =
                    Math.min(distance, 300);

                const scale =
                    Math.max(
                        0.85,
                        1 - movement / 1500
                    );

                lightboxImage.style.transform =
                    `translateY(${movement}px) scale(${scale})`;

                /*
                   Slightly reveal the page underneath
                   as the image is dragged away.
                */

                const opacity =
                    Math.max(
                        0.45,
                        0.97 - movement / 500
                    );

                lightbox.style.background =
                    `rgba(0, 0, 0, ${opacity})`;

            }

        },
        { passive: true }
    );


    lightbox.addEventListener(
        'touchend',
        function() {

            if (!isDragging) {
                return;
            }

            isDragging = false;

            const distance =
                touchCurrentY - touchStartY;


            /*
               Enough downward movement:
               close the viewer.
            */

            if (distance > 120) {

                lightboxImage.style.transition =
                    'transform 0.22s ease';

                lightboxImage.style.transform =
                    `translateY(100vh) scale(0.85)`;

                lightbox.style.transition =
                    'opacity 0.22s ease';

                lightbox.style.opacity = '0';

                setTimeout(function() {

                    closeLightbox();

                    /*
                       Restore normal CSS values.
                    */

                    setTimeout(function() {

                        lightboxImage.style.transform = '';
                        lightboxImage.style.transition = '';

                        lightbox.style.opacity = '';
                        lightbox.style.transition = '';

                        lightbox.style.background =
                            'rgba(0, 0, 0, 0.97)';

                    }, 50);

                }, 220);

            }

            /*
               Not enough movement:
               return the image to its position.
            */

            else {

                lightboxImage.style.transition =
                    'transform 0.25s ease';

                lightboxImage.style.transform =
                    'translateY(0) scale(1)';

                lightbox.style.transition =
                    'background 0.25s ease';

                lightbox.style.background =
                    'rgba(0, 0, 0, 0.97)';

            }

        }
    );


    /* =========================
       RESET DRAGGING
    ========================= */

    lightbox.addEventListener(
        'touchcancel',
        function() {

            isDragging = false;

            lightboxImage.style.transition =
                'transform 0.25s ease';

            lightboxImage.style.transform =
                'translateY(0) scale(1)';

            lightbox.style.background =
                'rgba(0, 0, 0, 0.97)';

        }
    );

</script>
