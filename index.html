<title>Guillaume Raynal — Concept Art / Illustration</title>

<style>

    /* =========================
       BASIC
    ========================= */

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 40px;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #111111;

        opacity: 0;
        animation: pageFadeIn 0.7s ease forwards;
    }

    @keyframes pageFadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }


    /* =========================
       HEADER
    ========================= */

    header {
        max-width: 1200px;
        margin: 0 auto 80px;
    }

    h1 {
        font-size: 32px;
        font-weight: 500;
        margin: 0 0 8px;
    }

    .subtitle {
        font-size: 16px;
        color: #555555;
        margin-bottom: 10px;
    }

    .contact {
        font-size: 13px;
        color: #777777;
    }

    .contact a {
        color: #555555;
        text-decoration: none;
    }

    .contact a:hover {
        color: #111111;
    }


    /* =========================
       MAIN
    ========================= */

    main {
        max-width: 1200px;
        margin: auto;
    }

    section {
        margin-bottom: 100px;
    }

    h2 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 30px;
    }


    /* =========================
       GALLERY
    ========================= */

    .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .gallery img {
        width: 100%;
        height: auto;
        display: block;

        cursor: pointer;

        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        max-width: 1200px;
        margin: 100px auto 30px;

        font-size: 14px;
        color: #777777;
    }

    footer a {
        color: #111111;
        text-decoration: none;
    }

    footer a:hover {
        text-decoration: underline;
    }

    .ai-note {
        margin-top: 18px;
        font-size: 11px;
        line-height: 1.5;
        color: #999999;
    }

    .copyright {
        margin-top: 12px;
    }


    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {
        position: fixed;
        z-index: 1000;

        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(0, 0, 0, 0.97);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
            opacity 0.25s ease,
            visibility 0.25s ease;

        overflow: hidden;

        touch-action: none;

        padding: 20px;
    }

    .lightbox.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }


    /* =========================
       LIGHTBOX IMAGE
    ========================= */

    .lightbox img {
        display: block;

        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 40px);

        width: auto;
        height: auto;

        object-fit: contain;

        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;

        transform: scale(0.94);

        transition:
            transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .lightbox.active img {
        transform: scale(1);
    }


    /* =========================
       CLOSE BUTTON
    ========================= */

    .lightbox-close {
        position: absolute;

        top: 15px;
        right: 20px;

        width: 50px;
        height: 50px;

        display: flex;
        align-items: center;
        justify-content: center;

        color: white;

        font-size: 36px;
        font-weight: 300;

        line-height: 1;

        cursor: pointer;
        user-select: none;

        z-index: 10;

        -webkit-tap-highlight-color: transparent;
    }
