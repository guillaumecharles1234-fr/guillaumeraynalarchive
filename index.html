
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Guillaume Raynal — Concept Art and Illustration">
  <title>Guillaume Raynal — Concept Art / Illustration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f8f7f4;
      color: #222;
      font-family: "Space Grotesk", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */

    header {
      max-width: 1156px;
      margin: 0 auto;
      padding: 52px 28px 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .identity h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -1.8px;
    }

    .subtitle {
      margin: 12px 0 0;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: #555;
    }

    .email {
      margin-top: 7px;
      font-size: 13px;
      color: #777;
      white-space: nowrap;
    }

    /* CATEGORY NAVIGATION */

    .category-nav {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 52px;
      padding-bottom: 16px;
      border-bottom: 1px solid #dedcd7;
    }

    .category-button {
      position: relative;
      padding: 0 0 5px;
      border: none;
      background: transparent;
      color: #898781;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .category-button:hover {
      color: #222;
    }

    .category-button.active {
      color: #222;
      font-weight: 700;
    }

    .category-button.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -17px;
      height: 2px;
      background: #222;
    }

    /* GALLERY */

    .gallery {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      max-width: 1156px;
      margin: 0 auto;
      padding: 28px 28px 60px;
    }

    .gallery-item {
      width: 100%;
      margin: 0;
      animation: fadeIn 0.45s ease both;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
      background: #eeece7;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* LIGHTBOX */

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 50px;
      background: rgba(15, 15, 15, 0.96);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      border: none;
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }

    .lightbox-close:hover,
    .lightbox-prev:hover,
    .lightbox-next:hover {
      opacity: 1;
    }

    .lightbox-close {
      top: 20px;
      right: 28px;
      font-size: 34px;
      font-weight: 300;
    }

    .lightbox-prev,
    .lightbox-next {
      top: 50%;
      transform: translateY(-50%);
      padding: 15px;
      font-size: 38px;
    }

    .lightbox-prev {
      left: 15px;
    }

    .lightbox-next {
      right: 15px;
    }

    /* FOOTER */

    footer {
      max-width: 1156px;
      margin: 0 auto;
      padding: 20px 28px 36px;
      border-top: 1px solid #dedcd7;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #898781;
      font-size: 11px;
      line-height: 1.6;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        padding: 34px 18px 0;
      }

      .header-top {
        flex-direction: column;
        gap: 12px;
      }

      .identity h1 {
        font-size: 31px;
      }

      .subtitle {
        margin-top: 10px;
        font-size: 10px;
        letter-spacing: 1.8px;
      }

      .email {
        margin-top: 0;
        font-size: 12px;
      }

      .category-nav {
        gap: 20px;
        margin-top: 36px;
        overflow-x: auto;
      }

      .category-button {
        font-size: 10px;
        white-space: nowrap;
      }

      .gallery {
        gap: 14px;
        padding: 20px 18px 40px;
      }

      .lightbox {
        padding: 15px;
      }

      .lightbox-close {
        top: 12px;
        right: 16px;
      }

      .lightbox-prev {
        left: 0;
      }

      .lightbox-next {
        right: 0;
      }

      footer {
        flex-direction: column;
        padding: 18px;
        gap: 6px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-top">
      <div class="identity">
        <h1>Guillaume Raynal</h1>
        <p class="subtitle">Concept Art · Illustration</p>
      </div>

      <div class="email">
        guillaumeraynal.contact@gmail.com
      </div>
    </div>

    <nav class="category-nav" aria-label="Portfolio categories">
      <button class="category-button active" data-category="all">All</button>
      <button class="category-button" data-category="illustration">Illustration</button>
      <button class="category-button" data-category="studies">Studies</button>
      <button class="category-button" data-category="sketches">Sketches</button>
    </nav>
  </header>

  <main>
    <section class="gallery" id="gallery" aria-label="Portfolio gallery"></section>
  </main>

  <footer>
    <span>All work shown here was created without generative AI.</span>
    <span>© 2026 Guillaume Raynal</span>
  </footer>

  <!-- LIGHTBOX -->

  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#8249;</button>
    <img id="lightboxImage" src="" alt="">
    <button class="lightbox-next" id="lightboxNext" aria-label="Next image">&#8250;</button>
  </div>

  <script>
    const categories = {
      illustration: 7,
      studies: 25,
      sketches: 64
    };

    const categoryOrder = [
      "illustration",
      "studies",
      "sketches"
    ];

    const gallery = document.getElementById("gallery");
    const categoryButtons = document.querySelectorAll(".category-button");

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxClose = document.getElementById("lightboxClose");
    const lightboxPrev = document.getElementById("lightboxPrev");
    const lightboxNext = document.getElementById("lightboxNext");

    let currentImages = [];
    let currentIndex = 0;

    function getImages(category) {
      const images = [];
      const selectedCategories =
        category === "all" ? categoryOrder : [category];

      selectedCategories.forEach(name => {
        for (let i = categories[name]; i >= 1; i--) {
          images.push({
            category: name,
            src: `images/${name}/${i}.webp`
          });
        }
      });

      return images;
    }

    function displayGallery(category = "all") {
      gallery.innerHTML = "";
      currentImages = getImages(category);

      currentImages.forEach((image, index) => {
        const figure = document.createElement("figure");
        figure.className = "gallery-item";

        const img = document.createElement("img");
        img.src = image.src;
        img.alt = `${image.category} artwork`;
        img.loading = "lazy";
        img.decoding = "async";

        img.addEventListener("click", () => {
          openLightbox(index);
        });

        figure.appendChild(img);
        gallery.appendChild(figure);
      });
    }

    categoryButtons.forEach(button => {
      button.addEventListener("click", () => {
        categoryButtons.forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");
        displayGallery(button.dataset.category);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function updateLightbox() {
      const image = currentImages[currentIndex];
      lightboxImage.src = image.src;
      lightboxImage.alt = `${image.category} artwork`;
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
      lightboxImage.src = "";
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % currentImages.length;
      updateLightbox();
    }

    function showPrevious() {
      currentIndex =
        (currentIndex - 1 + currentImages.length) % currentImages.length;
      updateLightbox();
    }

    lightboxClose.addEventListener("click", closeLightbox);
    lightboxNext.addEventListener("click", showNext);
    lightboxPrev.addEventListener("click", showPrevious);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;

      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowRight") showNext();
      if (event.key === "ArrowLeft") showPrevious();
    });

    /* Swipe down to close on mobile */

    let touchStartY = 0;

    lightbox.addEventListener("touchstart", event => {
      touchStartY = event.changedTouches[0].screenY;
    }, { passive: true });

    lightbox.addEventListener("touchend", event => {
      const touchEndY = event.changedTouches[0].screenY;
      const distance = touchEndY - touchStartY;

      if (distance > 100) {
        closeLightbox();
      }
    }, { passive: true });

    displayGallery("all");
  </script>

</body>
</html>
