<html lang="en">
<head>

<title>Guillaume Raynal — Concept Art · Illustration</title>

<style>
* {

}

body {
  margin: 0;
  background: #f8f7f4;

  font-family: Arial, Helvetica, sans-serif;

  max-width: 1100px;

  margin: 0;

}

.subtitle {
  margin-top: 7px;
  color: #777;

}

  margin-top: 18px;

  color: inherit;

  max-width: 1100px;

.gallery img {

  opacity: 0;

  to { opacity: 1; }

footer {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 28px 35px;
  color: #888;
  font-size: 12px;
  line-height: 1.8;

  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  background: rgba(15, 15, 15, 0.94);
  align-items: center;
  justify-content: center;
  padding: 50px 24px;
  touch-action: pan-y;

#lightbox.open {
  display: flex;

#lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  cursor: zoom-out;

  header {
    padding: 32px 18px 26px;

    grid-template-columns: 1fr;
    padding: 0 18px 40px;

</head>

<body>

<header>
  <h1>Guillaume Raynal</h1>
  <div class="subtitle">Concept Art · Illustration</div>
  <div class="contact">
    M : <a href="mailto:guillaumeraynal.contact@gmail.com">guillaumeraynal.contact@gmail.com</a>
  </div>
</header>

<main class="gallery" id="gallery"></main>

<footer>
  <div>All work shown here was created without generative AI.</div>
  <div>© 2026 Guillaume Raynal</div>
</footer>

<div id="lightbox" aria-label="Image viewer">
  <button id="lightbox-close" aria-label="Close image">&times;</button>
  <img id="lightbox-image" src="" alt="">
</div>

<script>
const totalImages = 3;
const gallery = document.getElementById('gallery');

for (let i = totalImages; i >= 1; i--) {
  const image = document.createElement('img');
  image.src = `images/${i}.jpg`;
  image.alt = `Concept art and illustration ${i}`;
  image.loading = 'lazy';
  image.style.animationDelay = `${(totalImages - i) * 0.08}s`;

  image.addEventListener('click', () => {
    openLightbox(image.src, image.alt);
  });

  gallery.appendChild(image);
}

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightbox-image');
const closeButton = document.getElementById('lightbox-close');

function openLightbox(src, alt) {
  lightboxImage.src = src;
  lightboxImage.alt = alt;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  lightboxImage.src = '';
  document.body.style.overflow = '';
}

closeButton.addEventListener('click', closeLightbox);

lightbox.addEventListener('click', (event) => {
  if (event.target === lightbox || event.target === lightboxImage) {
    closeLightbox();
  }
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    closeLightbox();
  }
});

let touchStartY = 0;

lightbox.addEventListener('touchstart', (event) => {
  touchStartY = event.changedTouches[0].screenY;
}, { passive: true });

lightbox.addEventListener('touchend', (event) => {
  const touchEndY = event.changedTouches[0].screenY;

  if (touchEndY - touchStartY > 100) {
    closeLightbox();
  }
}, { passive: true });
</script>

</body>
</html>
